<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    GradeSnap 아이콘.

    원장님이 주신 도안을 벡터로 다시 그린 것입니다. 채팅에 붙인 이미지는
    파일로 꺼낼 수가 없어서, 같은 구성(파란 그라데이션 · 스캔 모서리 ·
    답안지 · 카메라 · A+ 체크)을 SVG로 옮겼습니다. 원본 PNG를 저장소에
    넣어주시면 그걸로 바꿉니다.

    벡터라 16px 파비콘부터 1024px 앱 아이콘까지 한 파일로 커버됩니다.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.45" stop-color="#1D5FE8"/>
      <stop offset="1" stop-color="#1E3AC4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EDF5"/>
    </linearGradient>
    <linearGradient id="lens" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#3D5372"/>
      <stop offset="1" stop-color="#131E33"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#06122E" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- 스캔 모서리 — "찍으면 채점된다"가 이 아이콘의 문장입니다 -->
  <g fill="none" stroke="#EAFBFF" stroke-width="17" stroke-linecap="round" filter="url(#glow)" opacity="0.95">
    <path d="M96 152v-30a26 26 0 0 1 26-26h30"/>
    <path d="M416 152v-30a26 26 0 0 0-26-26h-30"/>
    <path d="M96 360v30a26 26 0 0 0 26 26h30"/>
    <path d="M416 360v30a26 26 0 0 1-26 26h-30"/>
  </g>

  <!-- 답안지. 오른쪽 위가 접힌 종이 -->
  <g filter="url(#soft)">
    <path d="M141 100h182l50 50v268a16 16 0 0 1-16 16H141a16 16 0 0 1-16-16V116a16 16 0 0 1 16-16z" fill="url(#paper)"/>
    <path d="M323 100l50 50h-40a10 10 0 0 1-10-10z" fill="#C3CEDE"/>
  </g>

  <!-- 머리말 두 줄 -->
  <g fill="#B9C4D4">
    <rect x="158" y="140" width="112" height="14" rx="7"/>
    <rect x="158" y="166" width="150" height="10" rx="5"/>
  </g>

  <!-- 문항 — 번호와 답란. 하나씩 정답이 찍혀 있습니다 -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#94A3B8">
    <text x="158" y="228">1.</text>
    <text x="158" y="272">2.</text>
    <text x="158" y="316">3.</text>
    <text x="158" y="360">4.</text>
  </g>
  <g fill="none" stroke="#CBD5E1" stroke-width="6">
    <circle cx="212" cy="220" r="13"/><circle cx="256" cy="220" r="13"/><circle cx="300" cy="220" r="13"/><circle cx="344" cy="220" r="13"/>
    <circle cx="212" cy="264" r="13"/><circle cx="256" cy="264" r="13"/><circle cx="300" cy="264" r="13"/><circle cx="344" cy="264" r="13"/>
    <circle cx="212" cy="308" r="13"/><circle cx="256" cy="308" r="13"/><circle cx="300" cy="308" r="13"/><circle cx="344" cy="308" r="13"/>
    <circle cx="212" cy="352" r="13"/><circle cx="256" cy="352" r="13"/><circle cx="300" cy="352" r="13"/><circle cx="344" cy="352" r="13"/>
  </g>
  <g fill="none" stroke="#0E9F86" stroke-width="6">
    <circle cx="256" cy="220" r="13"/><circle cx="300" cy="264" r="13"/>
    <circle cx="212" cy="308" r="13"/><circle cx="344" cy="352" r="13"/>
  </g>
  <g fill="#0E9F86">
    <circle cx="256" cy="220" r="6"/><circle cx="300" cy="264" r="6"/>
    <circle cx="212" cy="308" r="6"/><circle cx="344" cy="352" r="6"/>
  </g>

  <!-- 흩어진 픽셀 — 인식하는 중이라는 신호 -->
  <g fill="#5EE7FF">
    <rect x="72" y="196" width="13" height="13" rx="3" opacity="0.85"/>
    <rect x="92" y="222" width="19" height="19" rx="4"/>
    <rect x="70" y="248" width="11" height="11" rx="3" opacity="0.7"/>
    <rect x="98" y="272" width="15" height="15" rx="4" opacity="0.9"/>
  </g>
  <g fill="#7CC0FF">
    <rect x="404" y="200" width="13" height="13" rx="3" opacity="0.8"/>
    <rect x="428" y="224" width="18" height="18" rx="4"/>
    <rect x="406" y="252" width="11" height="11" rx="3" opacity="0.7"/>
  </g>
  <path d="M436 156l7 19 19 7-19 7-7 19-7-19-19-7 19-7z" fill="#EAFBFF" opacity="0.9"/>

  <!-- A+ 도장 -->
  <g filter="url(#soft)">
    <circle cx="368" cy="368" r="62" fill="#FFFFFF"/>
    <circle cx="368" cy="368" r="52" fill="none" stroke="#0E9F86" stroke-width="7"/>
    <path d="M341 368l19 21 38-46" fill="none" stroke="#0E9F86" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="368" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0E9F86">A+</text>
  </g>
  <g stroke="#8FF2DA" stroke-width="9" stroke-linecap="round" opacity="0.95">
    <path d="M440 316l22-16"/><path d="M452 344l26-3"/><path d="M424 296l10-24"/>
  </g>

  <!-- 카메라 — 조교가 하는 일은 이것 하나입니다 -->
  <g filter="url(#soft)">
    <rect x="186" y="342" width="140" height="122" rx="34" fill="#FFFFFF"/>
    <rect x="194" y="350" width="124" height="106" rx="28" fill="#22375C"/>
    <circle cx="256" cy="403" r="42" fill="#E2E8F0"/>
    <circle cx="256" cy="403" r="35" fill="url(#lens)"/>
    <circle cx="256" cy="403" r="17" fill="#0B1524"/>
    <circle cx="243" cy="390" r="9" fill="#7FE9FF" opacity="0.85"/>
  </g>
</svg>
